name: V75 Pulse Update
on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
      - name: Install Dependencies
        run: pip install deriv-api pandas_ta
      - name: Run Agent
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
        run: python agent.py
      - name: Commit and Push Data
        run: |
          git config --global user.name 'V75-Agent'
          git config --global user.email 'agent@bot.com'
          git add data.json
          git commit -m "Automated Pulse Update"
          git push
