name: V75 Pulse Heartbeat
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: |
          pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 requests python-deriv-api
          pip install https://github.com/twopirllc/pandas-ta/archive/development.zip

      - name: Run Agent
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
        run: python agent.py

      - name: Commit Data
        run: |
          git config --global user.name 'V75-Agent'
          git config --global user.email 'agent@bot.com'
          git add data.json history.json
          git commit -m "Update Dashboard Data" || exit 0
          git push
